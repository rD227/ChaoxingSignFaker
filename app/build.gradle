def versionPropertiesFile = file('version.properties')
def versionProperties = new Properties()
versionPropertiesFile.withInputStream { versionProperties.load(it) }
def storedVersionCode = versionProperties.getProperty('VERSION_CODE')
def storedVersionName = versionProperties.getProperty('VERSION_NAME')
if (!(storedVersionCode ==~ /[0-9]+/) || !(storedVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('version.properties must contain VERSION_CODE and a numeric x.y.z VERSION_NAME')
}
def currentVersionCode = storedVersionCode.toInteger()
if (currentVersionCode >= 2100000000) {
    throw new GradleException('VERSION_CODE has reached the Android version code limit')
}
def nextVersionCode = currentVersionCode + 1
def versionNameParts = storedVersionName.tokenize('.')
versionNameParts[-1] = (versionNameParts[-1].toBigInteger() + 1).toString()
def nextVersionName = versionNameParts.join('.')
def applicationProjectPath = project.path
def artifactBuildTask = ~/^(assemble|bundle|package|install)(Debug|Release)(Bundle|Apk)?$/

gradle.taskGraph.whenReady { graph ->
    def isArtifactBuild = graph.allTasks.any { task ->
        task.project.path == applicationProjectPath && artifactBuildTask.matcher(task.name).matches()
    }
    if (isArtifactBuild && !gradle.startParameter.dryRun) {
        versionPropertiesFile.withWriter('UTF-8') { writer ->
            writer.write("VERSION_CODE=${nextVersionCode}\nVERSION_NAME=${nextVersionName}\n")
        }
        logger.lifecycle("App version: ${storedVersionName} (${currentVersionCode}) -> ${nextVersionName} (${nextVersionCode})")
    }
}

android {
    namespace = "org.aquamarine5.brainspark.chaoxingsignfaker"
    compileSdk = 37

    defaultConfig {
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
        applicationId = "io.github.rd227.chaoxingsignfaker"
        minSdk = 26
        targetSdk = 37
        manifestPlaceholders["BAIDU_MAPS_API_KEY"] = providers.environmentVariable("BAIDU_MAPS_API_KEY").getOrElse("")
        versionCode = currentVersionCode
        versionName = storedVersionName

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    def releaseStorePath = providers.environmentVariable("RELEASE_KEYSTORE_PATH").orNull
    if (releaseStorePath) {
        signingConfigs {
            release {
                storeFile file(releaseStorePath)
                storePassword providers.environmentVariable("RELEASE_KEYSTORE_PASSWORD").get()
                keyAlias providers.environmentVariable("RELEASE_KEY_ALIAS").get()
                keyPassword providers.environmentVariable("RELEASE_KEY_PASSWORD").get()
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            optimization {
                enable = true
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
            if (releaseStorePath) signingConfig signingConfigs.release
            buildConfigField("String", "releaseDate", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\"")
        }
        debug {
            buildConfigField("String", "releaseDate", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\"")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    buildFeatures {
        compose = true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(providers.provider { nextVersionCode })
            output.versionName.set(providers.provider { nextVersionName })
        }
    }
}

composeCompiler {
    reportsDestination = layout.buildDirectory.dir("compose_compiler")
    metricsDestination = layout.buildDirectory.dir("compose_compiler")
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.36.2"
    }

    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

