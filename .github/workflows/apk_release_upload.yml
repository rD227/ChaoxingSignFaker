name: Android APK Build

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintRelease
        env:
          BAIDU_MAPS_API_KEY: ${{ secrets.BAIDU_MAPS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ChaoxingSignFaker-APKs
          path: app/build/outputs/apk/**/*.apk
